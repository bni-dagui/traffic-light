<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F4EF"><title>大貴分會｜紅綠燈查詢</title>
<style>
:root{--bg:#F7F4EF;--card:#FFFFFF;--ink:#2B2A28;--sub:#7A766F;--line:#ECE7DF;--acc:#CF2030;--g:#3E9B6E;--y:#D8A23A;--r:#C9524A;--x:#A3A09A;--gs:#E6F3EC;--ys:#FBF1DC;--rs:#F8E4E2;--xs:#EFEEEB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;font-size:15px;line-height:1.6;letter-spacing:.02em}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 48px}
header{padding:28px 0 18px}
.brand{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.18em}
h1{font-size:23px;font-weight:600;margin:4px 0 8px;letter-spacing:.04em}
.meta{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 14px}.meta span{white-space:nowrap}
.card{background:var(--card);border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 1px 2px rgba(40,30,20,.04),0 8px 24px rgba(40,30,20,.05)}
.search{position:relative}.search input{width:100%;font:inherit;font-size:17px;padding:15px 16px 15px 46px;border:1px solid var(--line);border-radius:14px;background:#FBFAF8;outline:none;transition:.2s}
.search input:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px rgba(207,32,48,.08)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.45}
.hint0{font-size:13px;color:var(--sub);margin:10px 2px 0}
#sug{margin-top:6px}.sg{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}.sg:last-child{border:0}.sg:active{background:#faf7f3}
.lbl{font-size:12px;color:var(--sub);letter-spacing:.12em;margin-bottom:10px}
.srow{margin:4px 0 18px}.srow:last-child{margin-bottom:0}.srow .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.srow .t b{font-weight:600}.srow .t small{color:var(--sub);font-size:12px}
.pbar{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--xs);margin-bottom:10px}.pbar i{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stats div{text-align:center}.stats b{display:block;font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}.stats span{font-size:11.5px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-g{background:var(--gs);color:var(--g)}.p-y{background:var(--ys);color:#B07F1C}.p-r{background:var(--rs);color:var(--r)}.p-x{background:var(--xs);color:#86827B}
.dg{color:var(--g)}.dy{color:var(--y)}.dr{color:var(--r)}.dx{color:var(--x)}
details{background:var(--card);border-radius:20px;margin-top:14px;box-shadow:0 1px 2px rgba(40,30,20,.04),0 8px 24px rgba(40,30,20,.05)}
summary{list-style:none;padding:18px 20px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}summary::-webkit-details-marker{display:none}
summary:after{content:"";width:8px;height:8px;border-right:1.5px solid var(--sub);border-bottom:1.5px solid var(--sub);transform:rotate(45deg);transition:.2s;margin-right:4px}details[open] summary:after{transform:rotate(-135deg)}
.dbody{padding:0 20px 20px}
.tw{overflow-x:auto;margin:0 -20px;padding:0 20px}table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--sub);font-size:12px;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);cursor:pointer;position:sticky;top:0;background:#fff}td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;padding-left:0}tbody tr{cursor:pointer}tbody tr:active td{background:#faf7f3}
.s{color:var(--sub);font-size:12.5px}.new{font-size:11px;color:#9A6B12;background:#FBF1DC;border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:500}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--sub);margin-top:12px}.tools input{width:64px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:10px;text-align:center;color:var(--ink)}
.btn{font:inherit;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}.btn.light{background:#F2EEE8;color:var(--ink)}
.rules li{margin:6px 0}.rules{padding-left:18px;margin:0;font-size:14px}
.foot{text-align:center;margin-top:28px}.foot a{color:var(--sub);font-size:12.5px;text-decoration:none;border-bottom:1px dotted #bbb}
#drop{border:1.5px dashed #D9D2C7;border-radius:20px;background:#fff;padding:28px;text-align:center;margin-top:14px}#drop.over{background:#FFF7F5;border-color:var(--acc)}
#modal{position:fixed;inset:0;background:rgba(30,25,20,.38);display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(2px)}
#mc{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px 28px;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@media(min-width:700px){#modal{align-items:center}#mc{border-radius:24px}}
.grab{width:40px;height:4px;border-radius:4px;background:#D8D2C8;margin:4px auto 12px}
.hero{background:#fff;border-radius:20px;padding:22px 20px;display:flex;gap:18px;align-items:center;box-shadow:0 8px 24px rgba(40,30,20,.05)}
.ring{flex:none;width:104px;height:104px;position:relative}.ring svg{transform:rotate(-90deg)}.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:32px;font-weight:600;line-height:1}.ring small{font-size:11px;color:var(--sub)}
.hname{font-size:22px;font-weight:600;margin-bottom:8px}.hrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;color:var(--sub)}
.sec{background:#fff;border-radius:20px;padding:18px 20px;margin-top:12px;box-shadow:0 8px 24px rgba(40,30,20,.04)}
.sec h3{font-size:16px;font-weight:600;margin:0 0 4px}.sec .sub{font-size:13px;color:var(--sub);margin:0 0 12px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}.steps li{counter-increment:s;display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.steps li:first-child{border:0}
.steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps .tx{flex:1}.steps .pt{font-weight:600;color:var(--acc);white-space:nowrap}.steps .tx small{display:block;color:var(--sub);font-size:12px}
.goal{display:inline-block;font-size:12px;letter-spacing:.1em;color:var(--acc);margin-bottom:2px}
.cele{font-size:15px;color:var(--g);font-weight:600}
.met{padding:10px 0;border-top:1px solid var(--line)}.met:first-of-type{border:0}.met .a{display:flex;justify-content:space-between;font-size:14px}.met .a span{color:var(--sub);font-variant-numeric:tabular-nums}
.tb{height:4px;background:#F0ECE5;border-radius:4px;margin:8px 0 4px;overflow:hidden}.tb i{display:block;height:100%;background:var(--ink);border-radius:4px}.tb.full i{background:var(--g)}
.met .n{font-size:12px;color:var(--sub)}
.drops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.drops b{display:block;font-size:18px;font-weight:600}.drops span{font-size:11.5px;color:var(--sub)}
.pick{display:flex;gap:8px;margin-top:10px}.pick select{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 36px 12px 14px;border:1px solid var(--line);border-radius:14px;background:#FBFAF8 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27%3E%3Cpath d=%27M1 1l5 5 5-5%27 fill=%27none%27 stroke=%27%237A766F%27 stroke-width=%271.5%27/%3E%3C/svg%3E") no-repeat right 14px center;-webkit-appearance:none;appearance:none;color:var(--ink)}.pick .btn{white-space:nowrap;padding:12px 14px;border-radius:14px}
a.nm{color:var(--ink);border-bottom:1px solid #D9D2C7;cursor:pointer}
.roll{border:1.5px solid #F1C9CC}.roll h3{color:var(--acc)}.rt{width:100%;border-collapse:collapse;font-size:14px;white-space:normal}.rt th{position:static;font-size:11.5px;line-height:1.3;color:var(--sub);text-align:right;padding:6px 4px;cursor:default}.rt td{padding:10px 4px;text-align:right;border-bottom:1px solid var(--line)}.rt th:first-child,.rt td:first-child{text-align:left}.rt tr:last-child td{border:0}.rt b{color:var(--acc);font-weight:600}
</style></head><body><div class="wrap">
<header><div class="brand">BNI</div><h1>大貴分會<span style="color:#C9C2B8;font-weight:300;margin:0 6px">｜</span>紅綠燈查詢</h1><div class="meta" id="dates"></div></header>
<div id="drop" class="card" style="display:none;text-align:left;border:0">
<h3 style="margin:0 0 4px;font-size:17px">幹部上傳</h3><p class="s" style="margin:0 0 12px">上傳 BNI Connect 的兩個 PALMS 摘要報告：<b>最近 6 個月</b>＋<b>最近 5 個月</b>（同一個結束日）。上傳後所有人打開網頁就會看到新資料。</p>
<div id="dz" style="border:1.5px dashed #D9D2C7;border-radius:16px;padding:22px;text-align:center;background:#FBFAF8;cursor:pointer">把兩個 .xls 檔拖到這裡，或<br><button class="btn" type="button" style="margin-top:10px" onclick="fi.click();event.stopPropagation()">選擇檔案</button><input type="file" id="fi" accept=".xls,.xml,.csv" multiple hidden></div>
<div id="upst" style="margin-top:12px;font-size:14px"></div>
<div id="upgo" style="display:none;margin-top:12px"><div id="uppv"></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><input id="upcode" inputmode="numeric" maxlength="12" placeholder="上傳碼" style="flex:1;min-width:120px;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px"><input id="upnote" placeholder="上傳人（選填）" style="flex:1;min-width:120px;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px"></div>
<button class="btn" id="upbtn" type="button" style="width:100%;margin-top:10px;background:var(--acc)">確認上傳，更新給所有人</button></div>
<div id="upmsg" style="margin-top:10px;font-size:14px"></div>
<p style="text-align:right;margin:10px 0 0"><a href="#" id="upcancel" class="s">取消，回到目前資料</a></p></div>
<div id="out" style="display:none">
<div class="card"><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B2A28" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="輸入你的名字" autocomplete="off"></div><div id="sug"></div><div class="pick"><select id="sel"></select><button class="btn light" id="golist" type="button">全體名單</button></div><p class="hint0" id="hint0">查看你現在的燈號、下個月預估，以及上綠燈的具體步驟。</p></div>
<div class="card"><div id="sum"></div></div>
<details id="dl" open><summary>全體會員列表</summary><div class="dbody"><div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div><div class="tools"><button class="btn light" id="csv">匯出 CSV</button><span>點欄位標題可排序</span></div></div></details>
<details><summary>評分標準與資料說明</summary><div class="dbody"><div id="rules"></div><div id="info" class="s" style="margin-top:14px"></div><div class="tools"><span id="nl">下個月例會次數：</span><input id="n" type="number" min="1"><span class="s"></span></div></div></details>
<div class="foot"><a href="#" id="upd">幹部上傳</a></div>
</div></div>
<div id="modal"><div id="mc"></div></div>
<script>
const T={ref:[[0,0],[18,5],[24,10],[29,15],[36,20]],o2o:[[0,0],[12,5],[24,10],[48,15]],gst:[[0,0],[6,10],[12,15]],edu:[[0,0],[2,5],[4,10],[6,15]],val:[[0,0],[400000,5],[800000,10],[2000000,15]]};
const L=[[0,'灰燈','x'],[30,'紅燈','r'],[50,'黃燈','y'],[70,'綠燈','g']];
const M=[['att','出席'],['ref','引薦'],['o2o','一對一'],['gst','帶來賓'],['edu','培訓'],['val','交易價值']];
let D=null,sortK='total',sortD=-1;
const attT=n=>[[0,0],[n-3,0],[n-2,10],[n-1,15],[n,20]];
const lk=(v,t)=>{let r=t[0];for(const x of t)if(v>=x[0])r=x;return r};
const nxt=(v,t)=>t.find(x=>x[0]>v&&x[1]>lk(v,t)[1]);
const num=s=>parseFloat(String(s||'').replace(/,/g,''))||0;
const fmt=v=>v.toLocaleString('zh-TW');
function parseXML(txt){const doc=new DOMParser().parseFromString(txt,'text/xml');const ns='urn:schemas-microsoft-com:office:spreadsheet';const rows=[];
 for(const r of doc.getElementsByTagNameNS(ns,'Row')){const v=[];for(const c of r.getElementsByTagNameNS(ns,'Cell')){const i=c.getAttributeNS(ns,'Index');if(i)while(v.length<i-1)v.push('');const d=c.getElementsByTagNameNS(ns,'Data')[0];v.push(d?d.textContent:'')}rows.push(v)}return rows}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
function build(rows){const hi=rows.findIndex(r=>r[0]=='姓氏');if(hi<0)throw'找不到「姓氏」欄位標題，請確認是 PALMS 摘要報告';
 const h=rows[hi].map(s=>s.trim()),c=k=>h.indexOf(k);const need=['名字','出席','缺席','遲到','病假','替代人','提供內部引薦','提供外部引薦','來賓','一對一會面','交易價值','分會教育單位'];
 const miss=need.filter(k=>c(k)<0);if(miss.length)throw'缺少欄位：'+miss.join('、');
 const meta={};rows.slice(0,hi).forEach((r,i)=>{const lab=r[0]||'';const val=r.filter(x=>x).slice(1).pop()||'';if(lab.startsWith('分會:'))meta.chapter=val;if(lab.startsWith('從'))meta.from=val.slice(0,10);if(lab.startsWith('至'))meta.to=val.slice(0,10);if(lab=='營運使用者'&&rows[i+1]){meta.user=rows[i+1][0];meta.run=(rows[i+1].filter(x=>x)[1]||'').replace('T',' ').slice(0,16)}});
 const mem=[];for(const r of rows.slice(hi+1)){const ln=(r[0]||'').trim(),fn=(r[c('名字')]||'').trim();if(!ln||['來賓','BNI','總數'].includes(ln)||!fn)continue;const g=k=>num(r[c(k)]);
  mem.push({name:ln+fn,present:g('出席'),abs:g('缺席'),late:g('遲到'),sick:g('病假'),sub:g('替代人'),att:g('出席')+g('遲到')+g('替代人'),ref:g('提供內部引薦')+g('提供外部引薦'),o2o:g('一對一會面'),gst:g('來賓'),edu:g('分會教育單位'),val:Math.round(g('交易價值'))})}
 mem.forEach(m=>m.meet=m.present+m.abs+m.late+m.sick+m.sub);const cnt={};mem.forEach(m=>cnt[m.meet]=(cnt[m.meet]||0)+1);
 meta.N=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b-a)[0];return{meta,mem}}
function score(){const N=+document.getElementById('n').value||D.meta.N;const tb={...T,att:attT(N)};
 D.mem.forEach(m=>{m.mid=m.meet<N;let t=0;M.forEach(([k])=>{m['s_'+k]=lk(m[k],tb[k])[1];t+=m['s_'+k]});m.total=t;const l=lk(t,L);m.light=l[1];m.cls=l[2]});D.tb=tb;render()}
function render(){const mem=D.mem,n=mem.length;document.getElementById('sum').innerHTML=[['綠燈','g'],['黃燈','y'],['紅燈','r'],['灰燈','x']].map(([l,c])=>{const k=mem.filter(m=>m.light==l).length;return`<div class="${c}">${l}<b>${k}</b>${(k/n*100).toFixed(1)}%</div>`}).join('');
 const cols=[['name','姓名'],...M.map(([k,l])=>[k,l]),['total','總分'],['light','燈號']];
 document.getElementById('th').innerHTML=cols.map(([k,l])=>`<th data-k="${k}">${l}${sortK==k?(sortD<0?' ▼':' ▲'):''}</th>`).join('');
 const q=document.getElementById('q').value.trim();const rows=mem.filter(m=>!q||m.name.includes(q)).sort((a,b)=>{const x=a[sortK],y=b[sortK];return(typeof x=='string'?x.localeCompare(y,'zh-Hant'):x-y)*sortD});
 document.getElementById('tb').innerHTML=rows.map(m=>`<tr data-n="${m.name}"><td>${m.name}${m.mid?'<span class="badge">新會員</span>':''}</td>${M.map(([k])=>`<td>${fmt(m[k])} <span class="s">(${m['s_'+k]})</span></td>`).join('')}<td><b>${m.total}</b></td><td><span class="dot ${m.cls}"></span>${m.light}</td></tr>`).join('')}
function detail(m){const N=+document.getElementById('n').value;let h=`<h2 style="margin:0 0 6px"><span class="dot ${m.cls}"></span>${m.name} — ${m.light}（${m.total} 分）</h2>`;
 if(m.mid)h+=`<p class="badge" style="display:inline-block">新會員：本期只有 ${m.meet} 次例會（全期 N=${N}），出席仍以 N 計分</p>`;
 h+=`<p class="s">出席 ${m.present}＋遲到 ${m.late}＋代理人 ${m.sub}＝${m.att}；缺席 ${m.abs}、病假 ${m.sick}</p><table>`;
 M.forEach(([k,l])=>{const t=D.tb[k],nx=nxt(m[k],t);const max=t[t.length-1][1];let hint;
  if(m['s_'+k]>=max)hint='<span class="ok">已滿分</span>';else if(k=='att')hint=nx&&nx[0]<=N?`<span class="hint">再出席 ${nx[0]-m[k]} 次可到 ${nx[1]} 分（本期已無法補，下期注意）</span>`:'';else hint=`<span class="hint">再 ${k=='val'?fmt(nx[0]-m[k])+' 元':(nx[0]-m[k])+' 次'} 可到 ${nx[1]} 分</span>`;
  h+=`<tr><td>${l}</td><td>${fmt(m[k])}</td><td>${m['s_'+k]} 分</td><td>${hint}</td></tr>`});
 const nl=L.find(x=>x[0]>m.total);h+=`</table><p>${nl?`<b class="hint">再 ${nl[0]-m.total} 分就到${nl[1]}</b>`:'<b class="ok">已經是綠燈，太棒了！</b>'}</p><button class="btn" onclick="modal.style.display='none'">關閉</button>`;
 mc.innerHTML=h;modal.style.display='flex'}
function load(file){const rd=new FileReader();rd.onload=()=>{try{const t=rd.result;const rows=/<Workbook|<\?mso-application/.test(t.slice(0,3000))?parseXML(t):parseCSV(t.replace(/^\uFEFF/,''));D=build(rows);const m=D.meta;
 document.getElementById('info').innerHTML=`<b>${m.chapter||''}</b>　期間：<b>${m.from||'?'} ～ ${m.to||'?'}</b>　會員 ${D.mem.length} 人<br><span class="s">報告產生：${m.run||''} ${m.user?'（'+m.user+'）':''}　檔名：${file.name}</span>`;
 document.getElementById('n').value=m.N;out.style.display='';score()}catch(e){alert('讀取失敗：'+e)}};rd.readAsText(file,'utf-8')}
const drop=document.getElementById('drop'),fi=document.getElementById('fi'),out=document.getElementById('out'),modal=document.getElementById('modal'),mc=document.getElementById('mc');
drop.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&load(fi.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
document.getElementById('n').oninput=score;document.getElementById('q').oninput=render;
document.getElementById('th').onclick=e=>{const k=e.target.dataset.k;if(!k)return;if(sortK==k)sortD=-sortD;else{sortK=k;sortD=k=='name'?1:-1}render()};

async function postLive(body){if(GSR)return await gsr('upload',JSON.stringify(body));const ctl=new AbortController();setTimeout(()=>ctl.abort(),30000);const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal});return await r.json()}
let shown=false;
async function loadLive(force){
 if(!shown){shown=true;if(SRV){LIVE={src:'雲端',at:SRV.updatedAt,note:SRV.note};showLive(SRV.data.rows)}else{LIVE={src:'內建',at:PRE_AT};showLive(PRE)}if(SRV&&!force)return}
 if(!GSR&&(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.startsWith('__')))return;
 try{const j=await getLive();if(!j||!j.ok||!j.data||!j.data.rows)throw(j&&j.error)||'no data';LIVE={src:'雲端',at:j.updatedAt,note:j.note};showLive(j.data.rows)}
 catch(e){console.warn('雲端資料讀取失敗，保留目前資料',e)}}
// ---- 幹部上傳 ----
const upst=document.getElementById('upst'),upgo=document.getElementById('upgo'),upmsg=document.getElementById('upmsg');
const ymd=s=>{const d=new Date(s);return{y:d.getFullYear(),m:d.getMonth(),t:d.getTime()}};
function validate(ds){if(ds.length!=2)return'請一次選擇「兩個」檔案：最近 6 個月 和 最近 5 個月。';
 const six=ds.find(d=>months(d.meta)>=6),five=ds.find(d=>months(d.meta)==5);
 if(!six||!five)return`期間不對：需要一個 6 個月檔、一個 5 個月檔。你選的是 ${ds.map(d=>`${d.meta.from}～${d.meta.to}（約 ${months(d.meta)} 個月）`).join('、')}。`;
 if(six.meta.chapter&&five.meta.chapter&&six.meta.chapter!=five.meta.chapter)return`兩個檔案的分會不同（${six.meta.chapter} / ${five.meta.chapter}）。`;
 const a=ymd(six.meta.to),b=ymd(five.meta.to);if(Math.abs(a.t-b.t)>7*864e5)return`兩個檔案的結束日不同（6 個月：${six.meta.to}、5 個月：${five.meta.to}），請用同一個結束日匯出。`;
 const s6=ymd(six.meta.from),s5=ymd(five.meta.from);if((s5.y*12+s5.m)-(s6.y*12+s6.m)!=1)return`開始月份不對：6 個月檔（${six.meta.from}）應該比 5 個月檔（${five.meta.from}）早一個月。`;
 if(!six.mem.length||!five.mem.length)return'檔案裡沒有會員資料。';return null}
async function pick(files){upmsg.innerHTML='';upgo.style.display='none';PENDING=null;
 const fs=[...files];upst.innerHTML='讀取中…';let ds=[],raws=[];
 try{for(const f of fs){const t=await f.text();const rows=/<Workbook|<\?mso-application/.test(t.slice(0,3000))?parseXML(t):parseCSV(t.replace(/^\uFEFF/,''));const hi=rows.findIndex(r=>r[0]=='姓氏');if(hi<0)throw`「${f.name}」不是 PALMS 摘要報告（找不到「姓氏」欄）。`;
   const keep=rows.slice(0,hi+1).concat(rows.slice(hi+1).filter(r=>r[0]&&r[0].trim()&&!['來賓','BNI','總數'].includes(r[0].trim())));const d=build(keep);d.fname=f.name;ds.push(d);raws.push(keep)}}
 catch(e){upst.innerHTML=`<span class="dr">✕ ${e}</span>`;return}
 upst.innerHTML=ds.map(d=>`<div>📄 ${d.fname}　<span class="s">${d.meta.from}～${d.meta.to}・約 ${months(d.meta)} 個月・${d.mem.length} 人</span></div>`).join('');
 const err=validate(ds);if(err){upst.innerHTML+=`<p class="dr" style="margin:8px 0 0">✕ ${err}</p>`;return}
 const order=ds.map((d,i)=>[months(d.meta),i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);PENDING={rows:order.map(i=>raws[i])};
 setData(order.map(i=>ds[i]),true);const c=k=>LIGHTS.map(l=>V.filter(o=>o[k]&&o[k].light==l).length).join(' / ');
 document.getElementById('uppv').innerHTML=`<div class="dg">✓ 檔案檢查通過</div><div class="s" style="margin-top:4px">預覽（綠 / 黃 / 紅 / 灰）　現在：${c('cur')}　下個月預估：${c('proj')}<br>上方畫面已換成預覽，確認後輸入上傳碼。</div>`;upgo.style.display=''}
document.getElementById('upbtn').onclick=async()=>{const code=document.getElementById('upcode').value.trim();if(!PENDING)return;if(!code){upmsg.innerHTML='<span class="dr">請輸入上傳碼。</span>';return}
 if(!GSR&&(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.startsWith('__'))){upmsg.innerHTML='<span class="dr">尚未設定雲端網址（APPS_SCRIPT_URL），無法上傳。</span>';return}
 const b=document.getElementById('upbtn');b.disabled=true;b.textContent='上傳中…';
 try{const j=await postLive({code,note:document.getElementById('upnote').value.trim(),data:PENDING});
  if(!j.ok)throw j.error||'上傳失敗';upmsg.innerHTML=`<span class="dg">✓ 上傳成功（${tw(j.updatedAt)}），所有人重新整理就會看到新資料。</span>`;upgo.style.display='none';PENDING=null;await loadLive(true)}
 catch(e){upmsg.innerHTML=`<span class="dr">✕ ${e}</span>`}finally{b.disabled=false;b.textContent='確認上傳，更新給所有人'}};
const dz=document.getElementById('dz');drop.onclick=null;drop.ondragover=drop.ondrop=null;
dz.onclick=()=>fi.click();fi.onchange=()=>{if(fi.files.length)pick(fi.files);fi.value=''};
dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='var(--acc)'};dz.ondragleave=()=>dz.style.borderColor='';dz.ondrop=e=>{e.preventDefault();dz.style.borderColor='';pick(e.dataTransfer.files)};
document.getElementById('upd').onclick=e=>{e.preventDefault();drop.style.display='';drop.scrollIntoView({behavior:'smooth'})};
document.getElementById('upcancel').onclick=e=>{e.preventDefault();drop.style.display='none';upst.innerHTML=upmsg.innerHTML='';upgo.style.display='none';PENDING=null;showLive(LIVE_ROWS||PRE)};
loadLive();
</script>
</body></html>
