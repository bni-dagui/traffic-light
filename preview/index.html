<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大貴分會｜紅綠燈查詢（v16 預覽）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{--bg:#F6F6F6;--ink:#222;--sub:#6B6B6B;--line:#E9E9E9;--acc:#CF2030;--g:#2E8B57;--y:#C98A00;--r:#CF2030;--x:#8A8A8A;--gs:#E5F4EC;--ys:#FFF3D6;--rs:#FCE3E5;--xs:#EEE}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6}
.top{background:#fff;border-bottom:3px solid var(--acc)}.topin{max-width:760px;margin:0 auto;padding:12px 16px 10px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.ttl{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;white-space:nowrap}.ttl i{display:block;width:5px;height:24px;background:var(--acc);border-radius:1px}.ttl em{font-style:normal;color:var(--acc)}
.slo{text-align:center;font-size:12px;letter-spacing:.3em;color:#444;display:flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}.slo:before,.slo:after{content:"";flex:1;max-width:80px;height:1px;background:#999}
.up{height:46px}
@media(max-width:560px){.topin{grid-template-columns:1fr auto}.slo{grid-column:1/3;grid-row:2;font-size:11.5px;letter-spacing:.25em}.up{height:42px}}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 20px}header{padding:18px 2px 4px}h1{font-size:26px;margin:0;font-weight:900}h1 span{color:var(--acc)}
.pv{background:#FFF3CD;color:#7a5a00;border-radius:8px;padding:5px 12px;font-size:13px;margin-top:8px}
.meta{font-size:12.5px;color:var(--sub)}.card{background:#fff;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-top:3px solid var(--acc)}
input,select{font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid #ddd;border-radius:10px;width:100%;background:#fff}input:focus,select:focus{outline:none;border-color:var(--acc)}
.sg{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 8px;border-radius:999px;font-size:13px;font-weight:700}.pill:before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.p-g{background:var(--gs);color:var(--g)}.p-y{background:var(--ys);color:var(--y)}.p-r{background:var(--rs);color:var(--r)}.p-x{background:var(--xs);color:var(--x)}
.s{color:var(--sub);font-size:12.5px}.new{font-size:11px;color:#9A6B12;background:#FFF3D6;border-radius:6px;padding:1px 6px;margin-left:6px}
.cnts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.cnts div{border-radius:12px;padding:8px 4px;text-align:center;font-weight:700}.cnts b{display:block;font-size:26px;line-height:1.2}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th{color:var(--sub);font-weight:500;font-size:12px;text-align:right;padding:6px;border-bottom:1px solid var(--line);cursor:pointer}td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}tbody tr{cursor:pointer}.tw{overflow-x:auto}
summary{cursor:pointer}.btn{font:inherit;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}.btn.l{background:#fff;color:var(--acc);border:1.5px solid var(--acc)}
#modal{position:fixed;inset:0;background:rgba(20,20,20,.45);display:none;align-items:center;justify-content:center;z-index:9}
#mc{background:var(--bg);width:100%;max-width:480px;max-height:96vh;overflow:auto;border-radius:18px;padding:14px}
.hero{border-radius:16px;padding:18px 16px 16px;background:#fff;text-align:center;border-top:5px solid var(--acc)}.hero .nm{font-size:20px;font-weight:900}
.lamp{width:92px;height:92px;border-radius:50%;margin:10px auto 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:900;box-shadow:0 0 0 7px rgba(0,0,0,.05)}
.hero .ln{font-size:22px;font-weight:900}.hero .to{font-size:13px;color:var(--sub)}
.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:8px 10px 0}.bar i{display:block;height:100%}
.bg-g{background:#2E8B57}.bg-y{background:#E0A100}.bg-r{background:#CF2030}.bg-x{background:#8A8A8A}.c-g{color:var(--g)}.c-y{color:var(--y)}.c-r{color:var(--r)}.c-x{color:var(--x)}
.goal{background:#fff;border-radius:16px;padding:14px 16px;margin-top:10px}.goal h3{margin:0 0 2px;font-size:17px;font-weight:900;border-left:5px solid var(--acc);padding-left:8px}
.it{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}.it:first-of-type{border-top:0}.it .k{flex:none;width:66px;font-weight:900}.it .v{flex:1}.it .p{flex:none;font-size:12.5px;font-weight:700;border-radius:8px;padding:1px 7px;background:#f1f1f1;color:#555}.it .p.full{background:var(--gs);color:var(--g)}
.it.done .v{color:var(--g);font-weight:700}
.ms{padding:10px 0;border-top:1px solid var(--line)}.ms:first-of-type{border-top:0}.ms .m{margin-top:4px}
.ok{color:var(--g)}.er{color:var(--r)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#F2F2F2;border-radius:999px;padding:3px 6px 3px 12px;margin:3px;font-size:13.5px}.chip button{border:0;background:#fff;border-radius:999px;cursor:pointer;padding:0 8px}
.foot{max-width:760px;margin:10px auto 0;position:relative;height:96px;overflow:hidden}.foot .bni{position:absolute;left:16px;bottom:16px;height:26px}.foot .sw{position:absolute;right:0;bottom:0;height:96px}
.mfoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px}.mfoot img.bni{height:20px;margin:0 0 6px 4px}.mfoot img.sw{height:50px}

/* 每一項各自算：下個月要做到多少，這項就滿分（W = 最近 5 個月自己的次數＋下個月例會次數） */
function solveFull(base,W,Mn){return KEYS.map(k=>{const it=CONFIG.ITEMS[k],full=maxPts(k);
  if(k=='att'){const l=it.levels.find(l=>base.absn<=l.max);return{k,pts:l?l.pts:0,full,att:Mn}}
  return{k,pts:full,full,n:needFor(k,it.levels.reduce((x,y)=>y.pts>x.pts?y:x),base,W)}})}
function compute(){const six=S.six,five=S.five;const m6=meetings(six.meta.from,six.meta.to),m5=meetings(five.meta.from,six.meta.to);
 const nx=new Date(six.meta.to+'T00:00:00');nx.setDate(nx.getDate()+1);const ny=nx.getFullYear(),nm=nx.getMonth();const last=new Date(ny,nm+1,0);
 const mN=meetings(iso(new Date(ny,nm,1)),iso(last));const om=+six.meta.from.slice(5,7);
 S.ctx={W6:m6.n,W5:m5.n,m6,mN,Mn:mN.n,nm:nm+1,om};
 const MAXM=Math.max(...six.mem.map(m=>m.meet));V=six.mem.map(a=>{const b=five.mem.find(x=>x.name==a.name)||{name:a.name,absn:0,ref:0,o2o:0,gst:0,val:0,edu:0,meet:0};
  const mid=a.meet<MAXM-CONFIG.NEW_MEMBER_GAP;/* 只用來顯示「新會員」標籤 */const W6=Math.max(1,a.meet),W5=Math.max(1,b.meet);/* 平均的分母＝自己在 PALMS 有紀錄的例會次數（出席+缺席+遲到+病假+代理） */
  const cur=score(a,W6),plan=solveFull(b,W5+S.ctx.Mn,S.ctx.Mn),ms=CONFIG.LIGHTS.filter(l=>l.min>0&&l.min>cur.t).reverse().map(l=>({l,r:solve(b,W5+S.ctx.Mn,S.ctx.Mn,l.min)}));
  return{name:a.name,a,b,mid,W6,W5,cur,plan,ms,pp:plan.reduce((x,y)=>x+y.pts,0),total:cur.t}});render()}
const pill=l=>`<span class="pill p-${l.c}">${l.name}</span>`;
function weekCheck(){const C=S.ctx,mx=d=>Math.max(...d.mem.map(m=>m.meet));const m5=meetings(S.five.meta.from,S.five.meta.to);
 const rows=[['最近 6 個月',S.six.meta,C.m6.n,mx(S.six)],['最近 5 個月',S.five.meta,m5.n,mx(S.five)]];const bad=rows.filter(r=>r[2]!=r[3]);
 const tx=r=>`${r[0]}（${r[1].from.slice(5).replace('-','/')}–${r[1].to.slice(5).replace('-','/')}）：行事曆 ${r[2]} 次、PALMS 最多 ${r[3]} 次`;
 const html=bad.length?`<div style="background:#F8E4E2;color:#8a2b24;border-radius:12px;padding:10px 12px;font-size:13.5px"><b>⚠ 例會次數對不上</b><br>${rows.map(r=>(r[2]!=r[3]?'✕ ':'✓ ')+tx(r)).join('<br>')}<br>${bad.map(r=>r[2]>r[3]?`行事曆多算 ${r[2]-r[3]} 次：期間內可能有臨時休會（例如颱風假）沒有標記，請在「幹部：臨時休會設定」標記那天。`:`行事曆少算 ${r[3]-r[2]} 次：可能有標錯的休會日期，或有額外加開的例會，請檢查休會清單。`).join('<br>')}</div>`
  :`<div style="background:#E6F3EC;color:#2f6e4f;border-radius:12px;padding:10px 12px;font-size:13.5px"><b>✓ 例會次數檢查通過</b><br>${rows.map(tx).join('<br>')}</div>`;
 return{bad:bad.length>0,html}}
function render(){const C=S.ctx,n=V.length,WC=weekCheck();$('chk').innerHTML=WC.html;
 document.getElementById('sum').innerHTML=`<div class="s">全體 ${n} 位會員</div><div class="cnts">${CONFIG.LIGHTS.map(l=>`<div class="p-${l.c}">${l.name}<b>${V.filter(o=>o.cur.l.name==l.name).length}</b></div>`).join('')}</div>${WC.bad?'<div style="margin:8px 0">'+WC.html.replace('例會次數對不上','幹部請注意：例會次數對不上')+'</div>':''}<p class="s" style="margin:0">6 個月內例會 ${C.W6} 次${C.m6.skip.length?'；休會：'+C.m6.skip.join('、'):''}<br>${C.nm}月例會 ${C.Mn} 次${C.mN.skip.length?'（休會：'+C.mN.skip.join('、')+'）':''}</p>`;
 const cols=[['name','姓名'],['total','分數']];
 document.getElementById('th').innerHTML=cols.map(([k,l])=>`<th data-k="${k}">${l}</th>`).join('');
 document.getElementById('tb').innerHTML=[...V].sort((x,y)=>{const a=x[sortK],b=y[sortK];return(typeof a=='string'?a.localeCompare(b,'zh-Hant'):a-b)*sortD}).map(o=>`<tr data-n="${o.name}"><td>${o.name}${o.mid?'<span class="new">新會員</span>':''}</td><td>${pill(o.cur.l)} ${o.cur.t}</td></tr>`).join('');
 document.getElementById('sel').innerHTML='<option value="">或從名單選擇…</option>'+[...V].sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant-TW-u-co-stroke')).map(o=>`<option>${o.name}</option>`).join('');
 rules();sug()}
function rules(){const I=CONFIG.ITEMS,f=k=>I[k].levels.map(l=>`${l.op=='gt'?'超過 ':''}${k=='val'?fmt(l.v/10000)+' 萬':l.v}${I[k].kind=='weekly'?'/週':I[k].kind=='per4w'?'/每4週':''}→${l.pts}`).join('、');
 document.getElementById('rules').innerHTML=`<ul style="padding-left:18px;margin:0;font-size:14px;line-height:1.8"><li>出席（6 個月缺席次數，病假算缺席）：0 次→20、1 次→15、2 次→10、3 次以上→0</li><li>引薦（每週平均）：${f('ref')}</li><li>一對一（每週平均）：${f('o2o')}</li><li>來賓（每 4 週平均）：${f('gst')}</li><li>交易價值（6 個月）：${f('val')}</li><li>培訓（6 個月學分，取 PALMS「分會教育單位」）：${f('edu')}</li><li>平均＝6 個月內總數 ÷ 自己在 PALMS 有紀錄的例會次數；下個月預估＝最近 5 個月自己的次數＋下個月例會次數（週五，扣國定假日與臨時休會）</li><li>滿分 100 分，目標是每項都拿滿；70 分以上綠燈、50 黃燈、30 紅燈、30 以下灰燈</li></ul>`}
function itemLine(o,x){const k=x.k,it=CONFIG.ITEMS[k],C=S.ctx,curFull=o.cur.s[k]>=x.full;let v,done=false;
 if(k=='att'){if(x.pts>=x.full){v=`下個月要做到：<b>全勤 ${C.Mn} 次</b>，這項就滿分`;if(curFull){v=`👏 出席滿分！下個月 <b>全勤 ${C.Mn} 次</b> 就繼續保持`;done=true}}
  else v=`缺席紀錄還在計算期間內，下個月這項最高 ${x.pts} 分；請<b>全勤 ${C.Mn} 次</b>，缺席滾出期間後就能回到滿分`}
 else if(x.n>0){const nm={ref:'引薦',o2o:'一對一',gst:'來賓',edu:'培訓'}[k],W=o.W5+C.Mn,cs=o.cur.s[k],wt=n=>k=='val'?`交易價值 ${fmt(n)} 元`:`${it.verb} ${fmt(n)} ${it.unit}${nm}`,what=wt(x.n);
  const up=it.levels.filter(l=>l.pts>cs).sort((a,b)=>a.pts-b.pts);
  if(up.length>=2){const nt=up[0],nn=needFor(k,nt,o.b,W);v=`下個月<b>${wt(nn)}</b>，這項就多 ${nt.pts-cs} 分<div class="s">衝滿分要${what}</div>`}
  else v=curFull?`👏 目前滿分！下個月要做到：<b>${what}</b>，就能保持滿分`:`下個月要做到：<b>${what}</b>，這項就滿分`}
 else{done=true;v=curFull?'👏 已經滿分，累計夠了，照現在的步調繼續就好！':'👏 累計已經夠，下個月這項就會滿分！'}
 return`<div class="it${done?' done':''}"><div class="k">${it.label}</div><div class="v">${v}</div><div class="p${curFull?' full':''}">${o.cur.s[k]}/${x.full}</div></div>`}
const ORD={att:0,o2o:1,ref:2,gst:3,edu:4,val:5},UN={ref:'引薦 # 筆',o2o:'一對一 # 次',gst:'來賓 # 位',edu:'培訓 # 學分',val:'交易價值 # 元'};
function msText(r){const C=S.ctx;return[...r.acc].sort((a,b)=>ORD[a.k]-ORD[b.k]).map(x=>x.k=='att'?(x.pts>0?(x.allow==0?`全勤 ${C.Mn} 次`:`出席至少 ${C.Mn-x.allow} 次`):''):(x.n>0?UN[x.k].replace('#',fmt(x.n)):'')).filter(Boolean).join('、')||'照目前步調就會達到'}
function detail(name){const o=V.find(x=>x.name==name),C=S.ctx,L=o.cur.l,nf=KEYS.filter(k=>o.cur.s[k]>=maxPts(k)).length;
 let h=`<div class="hero"><div class="nm">${o.name}${o.mid?' <span class="new">新會員</span>':''}</div><div class="lamp bg-${L.c}">${o.cur.t}</div><div class="ln c-${L.c}">${L.name}・${o.cur.t} 分</div><div class="bar"><i class="bg-${L.c}" style="width:${o.cur.t}%"></i></div><div class="to">目標 100 分｜目前 ${nf} 項滿分（近 6 個月）</div></div>`;
 if(o.ms.length)h+=`<div class="goal"><h3>${C.nm}月的里程碑</h3><div class="s">${C.nm}月預計 ${C.Mn} 次例會；以下是最省力的組合</div>`+o.ms.map(m=>`<div class="ms"><span class="pill p-${m.l.c}">上${m.l.name}（${m.l.min}分）</span><div class="m">${m.r.ok?`下個月要做到：<b>${msText(m.r)}</b>`:`下個月最多可到 ${m.r.p} 分，還差一點；先做到：<b>${msText(m.r)}</b>`}</div></div>`).join('')+`</div>`;
 else h+=`<div class="goal" style="text-align:center"><b>已經是綠燈 👍 下一步：衝滿分 100</b></div>`;
 h+=`<div class="goal"><h3>${C.nm}月每項衝滿分</h3><div class="s" style="margin-bottom:4px"><b>${C.nm}月預計 ${C.Mn} 次例會</b>${C.mN.skip.length?'（休會：'+C.mN.skip.join('、')+'）':''}</div>`;
 h+=[...o.plan].sort((a,b)=>ORD[a.k]-ORD[b.k]).map(x=>itemLine(o,x)).join('');
 h+=`<div class="s" style="margin-top:6px">每項都做到，${C.nm}月底預估：<b class="c-${light(o.pp).c}">${o.pp} 分</b>${o.pp==100?' 🎉':''}</div></div>`;
 const a=o.a;h+=`<details class="goal"><summary class="s">目前各項紀錄</summary><div class="s" style="line-height:1.9">例會 ${o.W6} 週・缺席 ${a.absn}・引薦 ${a.ref}（每週 ${(a.ref/o.W6).toFixed(2)}）・一對一 ${a.o2o}（每週 ${(a.o2o/o.W6).toFixed(2)}）・來賓 ${a.gst}（每4週 ${(a.gst/o.W6*4).toFixed(2)}）・交易價值 ${fmt(a.val)} 元・培訓 ${a.edu}<br>${KEYS.map(k=>CONFIG.ITEMS[k].label+' '+o.cur.s[k]).join('・')}<br>平均以你自己在 PALMS 有紀錄的 ${o.W6} 次例會計算</div></details>`;
 h+=`<button class="btn" style="width:100%;margin-top:12px" onclick="modal.style.display='none'">關閉</button><div class="mfoot"><img class="bni" src="${IMG_BNI}" alt="BNI ACCELERATE"><img class="sw" src="${IMG_SW}" alt=""></div>`;mc.innerHTML=h;modal.style.display='flex';mc.scrollTop=0}
function sug(){const q=document.getElementById('q').value.trim(),el=document.getElementById('sug');if(!q){el.innerHTML='';return}const r=V.filter(o=>o.name.includes(q)).slice(0,6);
 el.innerHTML=r.length?r.map(o=>`<div class="sg" data-n="${o.name}"><span>${o.name}${o.mid?'<span class="new">新會員</span>':''}</span>${pill(o.cur.l)}</div>`).join(''):'<p class="s">找不到這個名字</p>'}
const $=id=>document.getElementById(id),modal=$('modal'),mc=$('mc');
$('q').oninput=sug;$('sug').onclick=e=>{const d=e.target.closest('.sg');if(d)detail(d.dataset.n)};$('tb').onclick=e=>{const t=e.target.closest('tr');if(t)detail(t.dataset.n)};
$('sel').onchange=e=>{if(e.target.value){detail(e.target.value);e.target.value=''}};$('golist').onclick=()=>{$('dl').open=true;$('dl').scrollIntoView({behavior:'smooth'})};
$('th').onclick=e=>{const k=e.target.dataset.k;if(!k)return;sortD=sortK==k?-sortD:-1;sortK=k;render()};modal.onclick=e=>{if(e.target==modal)modal.style.display='none'};
// ---- 臨時休會 ----
function showCancel(){$('clist').innerHTML=CANCEL.length?CANCEL.sort((a,b)=>a.date<b.date?-1:1).map(c=>`<span class="chip">${c.date.replace(/-/g,'/')} ${c.note||''}<button data-d="${c.date}">✕</button></span>`).join(''):'<span class="s">目前沒有標記臨時休會</span>';
 if(!BACKEND_CANCEL)$('cmsg').innerHTML='預覽版：雲端後台還沒更新，標記只存在這台裝置，用來試算。'}
async function cancelOp(action,date,note){const code=$('code').value.trim();if(!code){$('cmsg').innerHTML='<span class="er">請輸入上傳碼</span>';return}
 if(BACKEND_CANCEL){const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,code,date,note})});const j=await r.json();if(!j.ok){$('cmsg').innerHTML=`<span class="er">${j.error}</span>`;return}CANCEL=j.cancelled}
 else{if(code!==PREVIEW_CODE){$('cmsg').innerHTML='<span class="er">上傳碼錯誤</span>';return}CANCEL=action=='cancel'?[...CANCEL.filter(c=>c.date!=date),{date,note}]:CANCEL.filter(c=>c.date!=date);localStorage.setItem('tl_cancel',JSON.stringify(CANCEL))}
 showCancel();compute();$('cmsg').innerHTML+=` <span class="ok">✓ 已更新</span>`}
$('cadd').onclick=()=>{const d=$('cd').value;if(!d){$('cmsg').innerHTML='<span class="er">請選日期</span>';return}if(new Date(d+'T00:00:00').getDay()!=5&&!confirm('這天不是星期五，確定要標記？'))return;cancelOp('cancel',d,$('cn').value.trim()||'臨時休會')};
$('clist').onclick=e=>{const d=e.target.dataset.d;if(d&&confirm(`取消 ${d} 的休會標記？`))cancelOp('uncancel',d)};
async function init(){let j;try{j=window.PRELOAD||await (await fetch(APPS_SCRIPT_URL+'?api=1&t='+Date.now(),{cache:'no-store'})).json()}catch(e){document.body.insertAdjacentHTML('beforeend','<p class="er">雲端資料讀取失敗</p>');return}
 if(Array.isArray(j.cancelled)){BACKEND_CANCEL=true;CANCEL=j.cancelled}else{CANCEL=JSON.parse(localStorage.getItem('tl_cancel')||'null')||DEFAULT_CANCEL.slice()}if(location.search.includes('sim=nocancel'))CANCEL=[];
 const ds=j.data.rows.map(build).sort((a,b)=>a.meta.from<b.meta.from?-1:1);S={six:ds[0],five:ds[1]};const m=S.six.meta;
 $('dates').innerHTML=`資料期間 ${m.from.replace(/-/g,'/')} – ${m.to.replace(/-/g,'/')}　雲端更新 ${new Date(j.updatedAt).toLocaleString('zh-TW',{hour12:false})}`;showCancel();compute();if(location.hash=='#adm'){$('adm').open=true}else if(location.hash.length>1)detail(decodeURIComponent(location.hash.slice(1)))}
init();
</script></body></html>
